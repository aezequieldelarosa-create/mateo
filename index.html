
<!DOCTYPE html>
<html>
<head>
    <title>Sombras del Pasillo</title>
</head>
<body style="background-color: black; color: white;">

<h2>Sombras del Pasillo</h2>
<p id="puntos">Puntos: 0</p>

<canvas id="juego" width="500" height="300"
style="background-color: #333;"></canvas>

<script>
let jugadorX = 100;
let jugadorY = 100;
let monedaX = 200;
let monedaY = 200;
let puntos = 0;

let pantalla = document.getElementById("juego");
let dibujo = pantalla.getContext("2d");

function dibujar() {
    dibujo.clearRect(0, 0, 500, 300);

    dibujo.fillStyle = "red";
    dibujo.fillRect(jugadorX, jugadorY, 25, 25);

    dibujo.fillStyle = "yellow";
    dibujo.beginPath();
    dibujo.arc(monedaX, monedaY, 10, 0, 6.28);
    dibujo.fill();
}

document.addEventListener("keydown", function(evento) {
    if (evento.key == "ArrowUp" && jugadorY > 0) {
        jugadorY = jugadorY - 5;
    }

    if (evento.key == "ArrowDown" && jugadorY < 275) {
        jugadorY = jugadorY + 5;
    }

    if (evento.key == "ArrowLeft" && jugadorX > 0) {
        jugadorX = jugadorX - 5;
    }

    if (evento.key == "ArrowRight" && jugadorX < 475) {
        jugadorX = jugadorX + 5;
    }

    if (Math.abs(jugadorX - monedaX) < 25 &&
        Math.abs(jugadorY - monedaY) < 25) {
        puntos = puntos + 10;
        document.getElementById("puntos").innerHTML = "Puntos: " + puntos;

        monedaX = Math.floor(Math.random() * 450) + 20;
        monedaY = Math.floor(Math.random() * 250) + 20;
    }

    dibujar();
});

dibujar();
</script>

</body>
</html>
